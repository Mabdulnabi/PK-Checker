<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>المتجر — PK Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb;--surface:#fff;--border:#e4e9f2;
  --text:#1a2340;--muted:#6b7a99;--accent:#0e7afe;--cyan:#00baf7;
  --ok:#0e9f6e;--warn:#f59e0b;--danger:#e0445b;
  --navy:#1b2556;--radius:14px;
}
html,body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── Topnav ── */
.topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.nav-logo{font-size:18px;font-weight:800;color:var(--text)}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;transition:color .15s}
.nav-links a:hover,.nav-links a.on{color:var(--accent)}
.nav-cta{padding:7px 16px;border-radius:8px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}

/* ── Page ── */
.page{max-width:1200px;margin:0 auto;padding:28px 20px}
.page-header{margin-bottom:24px;text-align:center}
.page-title{font-size:26px;font-weight:800;color:var(--text)}
.page-sub{font-size:14px;color:var(--muted);margin-top:6px}

/* ── Search ── */
.search-wrap{max-width:460px;margin:0 auto 24px;position:relative}
.search-wrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-inp{width:100%;padding:11px 42px 11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);font-family:'Cairo',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .15s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.search-inp:focus{border-color:var(--accent)}

/* ── Category chips ── */
.cats-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.cat-chip{padding:7px 16px;border-radius:30px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:600;color:var(--muted);transition:all .15s;white-space:nowrap;user-select:none}
.cat-chip:hover{border-color:var(--accent);color:var(--accent)}
.cat-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ── Filter bar ── */
.filter-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.filter-left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-btn{padding:6px 14px;border-radius:30px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:600;color:var(--muted);transition:all .15s}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.filter-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.results-count{font-size:12px;color:var(--muted);font-weight:600}

/* ── Grid ── */
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}

/* ── Card ── */
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .2s,transform .2s;cursor:pointer;display:flex;flex-direction:column}
.prod-card:hover{box-shadow:0 8px 28px rgba(0,0,0,.08);transform:translateY(-2px)}
.card-stripe{height:3px}
.card-img{height:120px;background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-bottom:1px solid var(--border)}
.card-img img{width:72px;height:72px;object-fit:contain}
.card-img .initials{font-size:28px;font-weight:900;color:var(--muted);opacity:.4}
.card-badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700}
.badge-oos{background:#fee2e2;color:#991b1b}
.badge-new{background:#d1fae5;color:#065f46}
.card-body{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:6px}
.card-title{font-size:15px;font-weight:800;color:var(--text);line-height:1.3}
.card-desc{font-size:12px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;gap:5px;flex-wrap:wrap}
.card-tag{padding:2px 8px;border-radius:5px;font-size:10px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.card-footer{padding:10px 16px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-price{display:flex;flex-direction:column;gap:1px}
.price-main{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--accent)}
.price-retail{font-size:11px;color:var(--muted);text-decoration:line-through}
.price-dur{font-size:10px;color:var(--muted);margin-top:1px}
.card-rating{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--warn)}
.card-rating span{color:var(--muted)}
.btn-buy{padding:8px 16px;border-radius:9px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;transition:all .15s;white-space:nowrap}
.btn-buy:hover{background:#0b5fc9}
.btn-buy.oos{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);cursor:not-allowed}

/* ── Product modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.hidden{display:none}
.modal{width:100%;max-width:560px;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden;max-height:90vh;overflow-y:auto}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-img{width:44px;height:44px;border-radius:11px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.modal-img img{width:34px;height:34px;object-fit:contain}
.modal-title{font-size:15px;font-weight:800;flex:1}
.modal-close{width:28px;height:28px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-close:hover{background:var(--border)}
.modal-body{padding:20px}
.modal-info-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 14px}
.info-box-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px}
.info-box-val{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.features-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.feature-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text)}
.feature-dot{color:var(--ok);flex-shrink:0;margin-top:1px}
.buy-section{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.buy-price{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;color:var(--accent)}
.buy-price-retail{font-size:13px;color:var(--muted);text-decoration:line-through;margin-right:6px}
.buy-dur{font-size:12px;color:var(--muted);margin-top:2px;margin-bottom:14px}
.btn-buy-modal{width:100%;padding:13px;border-radius:11px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;transition:all .15s}
.btn-buy-modal:hover{background:#0b5fc9}
.btn-buy-modal.oos{background:var(--bg);color:var(--muted);border:1.5px solid var(--border);cursor:not-allowed}

/* ── Empty / spinner ── */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:14px}
.spin-wrap{grid-column:1/-1;display:flex;justify-content:center;padding:60px}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;z-index:999;animation:slideUp .3s;white-space:nowrap}
.toast-ok{background:var(--ok)}
.toast-info{background:var(--accent)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:600px){
  .products-grid{grid-template-columns:1fr 1fr}
  .nav-links{display:none}
}
@media(max-width:420px){
  .products-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-logo">PK<span>Checker</span></div>
  <div class="nav-links">
    <a href="store.html" class="on">المتجر</a>
    <a href="my-orders.html">اشتراكاتي</a>
  </div>
  <a href="my-orders.html" class="nav-cta">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    اشتراكاتي
  </a>
</nav>

<div class="page">
  <div class="page-header">
    <div class="page-title">متجر Pro Keys</div>
    <div class="page-sub">اشتراكات وأدوات احترافية بأسعار مناسبة</div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-inp" id="search-inp" placeholder="ابحث عن منتج…" oninput="onSearch()"/>
  </div>

  <!-- Category chips -->
  <div class="cats-row" id="cats-row">
    <button class="cat-chip on" onclick="filterCat('',this)">الكل</button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-left">
      <button class="filter-btn on" onclick="filterType('all',this)">الكل</button>
      <button class="filter-btn" onclick="filterType('available',this)">متوفر</button>
      <button class="filter-btn" onclick="filterType('oos',this)">نفد</button>
    </div>
    <div class="results-count" id="results-count"></div>
  </div>

  <!-- Grid -->
  <div class="products-grid" id="products-grid">
    <div class="spin-wrap"><div class="spin"></div></div>
  </div>
</div>

<!-- Product modal -->
<div id="prod-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-img" id="modal-img-wrap">
        <div class="initials" style="font-size:12px;font-weight:800;color:var(--muted)" id="modal-img-ini"></div>
      </div>
      <div class="modal-title" id="modal-title">المنتج</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
const { createClient } = supabase
const sb = createClient(
  'https://ixpgqhwausnfjphitsty.supabase.co',
  'sb_publishable_Iz-TCMtlndecE5p-ypewuu_6pwitPTw'
)

let tools = [], cats = []
let catF = '', typeF = 'all', searchQ = ''

const STRIPES = ['#3b82f6','#8b5cf6','#f59e0b','#ec4899','#14b8a6','#f97316','#06b6d4']

async function loadStore() {
  const [{ data: t }, { data: c }] = await Promise.all([
    sb.from('shop_tools').select('*').eq('is_active', true).order('sort_order'),
    sb.from('shop_categories').select('*').order('sort_order'),
  ])
  tools = t || []
  cats  = c || []
  buildCats()
  renderGrid()
}

function buildCats() {
  const row = document.getElementById('cats-row')
  row.innerHTML = `<button class="cat-chip on" onclick="filterCat('',this)">الكل</button>` +
    cats.map(c => `<button class="cat-chip" onclick="filterCat('${c.slug}',this)">${esc(c.name)}</button>`).join('')
}

function filterCat(slug, btn) {
  catF = slug
  document.querySelectorAll('.cat-chip').forEach(b => b.classList.remove('on'))
  btn.classList.add('on')
  renderGrid()
}

function filterType(t, btn) {
  typeF = t
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'))
  btn.classList.add('on')
  renderGrid()
}

function onSearch() {
  searchQ = document.getElementById('search-inp').value.toLowerCase()
  renderGrid()
}

function renderGrid() {
  let list = tools.filter(t => {
    if (catF && t.category_slug !== catF) return false
    if (typeF === 'available' && t.is_out_of_stock) return false
    if (typeF === 'oos' && !t.is_out_of_stock) return false
    if (searchQ && !(t.name||'').toLowerCase().includes(searchQ) && !(t.description||'').toLowerCase().includes(searchQ)) return false
    return true
  })

  document.getElementById('results-count').textContent = `${list.length} منتج`

  const grid = document.getElementById('products-grid')
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>لا توجد منتجات مطابقة</p></div>`
    return
  }

  grid.innerHTML = list.map((t, i) => {
    const stripe = STRIPES[i % STRIPES.length]
    const catObj = cats.find(c => c.slug === t.category_slug)
    const catName = catObj?.name || t.category_slug || ''
    const oos = t.is_out_of_stock
    const isNew = new Date() - new Date(t.created_at || 0) < 7 * 24 * 60 * 60 * 1000

    const imgHtml = t.image_url
      ? `<img src="${esc(t.image_url)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="initials" style="display:none">${(t.name||'').slice(0,2).toUpperCase()}</span>`
      : `<span class="initials">${(t.name||'').slice(0,2).toUpperCase()}</span>`

    const badge = oos ? '<span class="card-badge badge-oos">نفد</span>'
                : isNew ? '<span class="card-badge badge-new">جديد</span>' : ''

    const retailLine = t.retail_price_egp ? `<span class="price-retail">${Number(t.retail_price_egp).toLocaleString()} EGP</span>` : ''

    const features = (t.features||[]).slice(0,2).map(f => `<span class="card-tag">${esc(f)}</span>`).join('')

    return `<div class="prod-card" onclick="openModal('${t.id}')">
      <div class="card-stripe" style="background:${stripe}"></div>
      <div class="card-img">
        ${imgHtml}
        ${badge}
      </div>
      <div class="card-body">
        <div class="card-title">${esc(t.name)}</div>
        ${t.description ? `<div class="card-desc">${esc(t.description)}</div>` : ''}
        ${catName ? `<div class="card-tags"><span class="card-tag">${esc(catName)}</span>${features}</div>` : ''}
      </div>
      <div class="card-footer">
        <div class="card-price">
          ${retailLine}
          <span class="price-main">${Number(t.price_egp||0).toLocaleString()} EGP</span>
          ${t.duration_label ? `<span class="price-dur">${esc(t.duration_label)}</span>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${t.rating ? `<div class="card-rating">⭐<span>${t.rating}</span></div>` : ''}
          <button class="btn-buy ${oos ? 'oos' : ''}" onclick="event.stopPropagation();${oos ? '' : `openModal('${t.id}')`}">${oos ? 'نفد' : 'اشترِ'}</button>
        </div>
      </div>
    </div>`
  }).join('')
}

function openModal(id) {
  const t = tools.find(t => t.id === id)
  if (!t) return

  const imgWrap = document.getElementById('modal-img-wrap')
  if (t.image_url) {
    imgWrap.innerHTML = `<img src="${esc(t.image_url)}" style="width:34px;height:34px;object-fit:contain" onerror="this.style.display='none'">`
  } else {
    imgWrap.innerHTML = `<span style="font-size:12px;font-weight:800;color:var(--muted)">${(t.name||'').slice(0,2).toUpperCase()}</span>`
  }
  document.getElementById('modal-title').textContent = t.name

  const catObj = cats.find(c => c.slug === t.category_slug)
  const oos = t.is_out_of_stock
  const retailLine = t.retail_price_egp
    ? `<span class="buy-price-retail">${Number(t.retail_price_egp).toLocaleString()} EGP</span>` : ''

  const featuresList = (t.features||[]).length
    ? `<div style="margin-bottom:16px">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px">المميزات</div>
        <div class="features-list">${(t.features||[]).map(f => `<div class="feature-item"><span class="feature-dot">✓</span>${esc(f)}</div>`).join('')}</div>
      </div>` : ''

  document.getElementById('modal-body').innerHTML = `
    ${t.description ? `<p style="font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:16px">${esc(t.description)}</p>` : ''}
    <div class="modal-info-row">
      <div class="info-box"><div class="info-box-label">الفئة</div><div class="info-box-val">${esc(catObj?.name || t.category_slug || '—')}</div></div>
      <div class="info-box"><div class="info-box-label">التسليم</div><div class="info-box-val">${esc(t.delivery_label||'—')}</div></div>
      <div class="info-box"><div class="info-box-label">المدة</div><div class="info-box-val">${esc(t.duration_label||'—')}</div></div>
      ${t.rating ? `<div class="info-box"><div class="info-box-label">التقييم</div><div class="info-box-val">⭐ ${t.rating} (${t.review_count||0})</div></div>` : ''}
    </div>
    ${featuresList}
    <div class="buy-section">
      <div style="display:flex;align-items:baseline;justify-content:center;gap:6px">
        ${retailLine}
        <span class="buy-price">${Number(t.price_egp||0).toLocaleString()} EGP</span>
      </div>
      ${t.duration_label ? `<div class="buy-dur">${esc(t.duration_label)}</div>` : '<div class="buy-dur"></div>'}
      <button class="btn-buy-modal ${oos ? 'oos' : ''}" onclick="${oos ? '' : `handleBuy('${t.id}')`}">${oos ? 'نفد المخزون' : 'اشترِ الآن'}</button>
    </div>`

  document.getElementById('prod-modal').classList.remove('hidden')
}

function closeModal() {
  document.getElementById('prod-modal').classList.add('hidden')
}

function handleBuy(id) {
  const t = tools.find(t => t.id === id)
  if (!t || t.is_out_of_stock) return
  // Redirect to checkout / orders page — customize as needed
  window.location.href = `my-orders.html`
}

// ── Toast ──
function toast(msg, type = 'ok') {
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.textContent = msg
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 3000)
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

loadStore()
</script>
</body>
</html>
