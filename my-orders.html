<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>اشتراكاتي — PK Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fb;--surface:#fff;--border:#e4e9f2;
  --text:#1a2340;--muted:#6b7a99;--accent:#0e7afe;
  --ok:#0e9f6e;--warn:#f59e0b;--danger:#e0445b;
  --navy:#1b2556;--radius:14px;
}
html,body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.mono{font-family:'IBM Plex Mono',monospace}
.latin{font-family:'Space Grotesk',sans-serif}

/* ── Nav ── */
.topnav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.nav-logo{font-size:18px;font-weight:800;color:var(--text)}
.nav-logo span{color:var(--accent)}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.nav-links a:hover{color:var(--accent)}
.nav-links a.active{color:var(--accent)}
.user-pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:30px;background:var(--bg);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#00baf7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0}

/* ── Page ── */
.page{max-width:1100px;margin:0 auto;padding:28px 20px}
.page-header{margin-bottom:24px}
.page-title{font-size:22px;font-weight:800;color:var(--text)}
.page-sub{font-size:13px;color:var(--muted);margin-top:4px}

/* ── Stats ── */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:14px}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px}
.stat-val{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}

/* ── Filters ── */
.filters{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filter-group{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);padding:4px;border-radius:10px}
.filter-btn{padding:6px 12px;border-radius:7px;border:none;background:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:12px;font-weight:700;color:var(--muted);transition:all .15s}
.filter-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.search-wrap{position:relative;flex:1;max-width:280px}
.search-wrap svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-inp{width:100%;padding:8px 34px 8px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);font-family:'Cairo',sans-serif;font-size:13px;color:var(--text);outline:none;transition:border-color .15s}
.search-inp:focus{border-color:var(--accent)}

/* ── Grid ── */
.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ── Order card ── */
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:box-shadow .2s}
.order-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.07)}
.card-stripe{height:3px}
.card-head{padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
.tool-thumb{width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.tool-thumb img{width:30px;height:30px;object-fit:contain}
.tool-thumb .initials{font-size:11px;font-weight:800;color:var(--muted)}
.card-tool-name{font-size:14px;font-weight:800;color:var(--text);line-height:1.3}
.card-type{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:700;display:inline-block;margin-top:3px;text-transform:capitalize}
.type-shared{background:#eff6ff;color:#2563eb}
.type-private{background:#f5f3ff;color:#7c3aed}
.type-bundle{background:#fffbeb;color:#d97706}
.card-body{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.info-row{display:flex;align-items:center;justify-content:space-between;font-size:12px}
.info-label{color:var(--muted);font-weight:600}
.info-val{font-weight:700;color:var(--text)}
.price-val{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px}
.card-footer{padding:0 16px 14px}
.btn-reveal{width:100%;padding:9px;border-radius:9px;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-reveal.pending{background:var(--bg);border:1.5px dashed var(--border);color:var(--muted);cursor:not-allowed}
.btn-reveal.ready{background:var(--accent);color:#fff}
.btn-reveal.ready:hover{background:#0b5fc9}
.btn-reveal.revealed{background:#f0fdf4;border:1.5px solid #bbf7d0;color:#15803d}

/* ── Status ── */
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700}
.status-active{background:#d1fae5;color:#065f46}
.status-expired{background:#fee2e2;color:#991b1b}
.status-pending{background:#fef3c7;color:#92400e}

/* ── Delivery modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal-overlay.hidden{display:none}
.modal{width:100%;max-width:460px;background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:800;color:var(--text)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.cred-box{background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:14px}
.cred-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.cred-val{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px;word-break:break-all}
.copy-btn{padding:4px 10px;border-radius:7px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0;font-family:'Cairo',sans-serif}
.key-box{background:#1e1e2e;border-radius:11px;padding:14px;border:1px solid #2a2a3e}
.key-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#a5f3fc;word-break:break-all;line-height:1.6}
.notes-box{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px;font-size:13px;color:#92400e;line-height:1.6}

/* ── Empty / spinner ── */
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:48px;margin-bottom:12px}
.spin-wrap{display:flex;justify-content:center;padding:60px;grid-column:1/-1}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:24px}
.page-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:'Cairo',sans-serif;font-size:13px;font-weight:700;color:var(--muted);transition:all .15s;display:flex;align-items:center;justify-content:center}
.page-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.page-btn:hover:not(.on){background:var(--bg)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Auth screen ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:400px;text-align:center}
.auth-logo{font-size:28px;font-weight:900;color:var(--text);margin-bottom:6px}
.auth-logo span{color:var(--accent)}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.auth-inp{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Cairo',sans-serif;font-size:14px;color:var(--text);background:var(--bg);outline:none;margin-bottom:10px;transition:border-color .15s;text-align:right}
.auth-inp:focus{border-color:var(--accent)}
.auth-btn{width:100%;padding:12px;border-radius:10px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-size:14px;font-weight:800;margin-top:4px;transition:all .15s}
.auth-btn:hover{background:#0b5fc9}
.auth-btn:disabled{opacity:.6;cursor:not-allowed}
.auth-err{font-size:12px;color:var(--danger);margin-top:8px}
.auth-toggle{font-size:12px;color:var(--muted);margin-top:16px;cursor:pointer}
.auth-toggle span{color:var(--accent);font-weight:700}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;z-index:999;animation:slideUp .3s ease;display:flex;align-items:center;gap:8px;white-space:nowrap}
.toast-ok{background:var(--ok)}
.toast-err{background:var(--danger)}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media(max-width:600px){
  .stats-row{grid-template-columns:1fr 1fr}
  .stats-row .stat-card:last-child{grid-column:span 2}
  .orders-grid{grid-template-columns:1fr}
  .nav-links{display:none}
}
</style>
</head>
<body>

<!-- Auth screen (shown when not logged in) -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">PK<span>Checker</span></div>
    <div class="auth-sub">سجّل دخولك لعرض اشتراكاتك</div>
    <input class="auth-inp" id="auth-email" type="email" placeholder="البريد الإلكتروني" dir="ltr"/>
    <input class="auth-inp" id="auth-pass" type="password" placeholder="كلمة المرور" dir="ltr"/>
    <button class="auth-btn" id="auth-btn" onclick="signIn()">دخول</button>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-toggle" onclick="toggleAuthMode()">
      <span id="auth-toggle-text">ليس لديك حساب؟ <span>إنشاء حساب</span></span>
    </div>
  </div>
</div>

<!-- Main app (shown when logged in) -->
<div id="app" style="display:none">
  <nav class="topnav">
    <div class="nav-logo">PK<span>Checker</span></div>
    <div class="nav-links">
      <a href="store.html">المتجر</a>
      <a href="my-orders.html" class="active">اشتراكاتي</a>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="user-pill">
        <div class="user-avatar" id="user-initials">U</div>
        <span id="user-email-short" style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      </div>
      <button onclick="signOut()" style="padding:7px 14px;border-radius:9px;border:1px solid var(--border);background:none;cursor:pointer;font-family:Cairo,sans-serif;font-size:12px;font-weight:700;color:var(--muted)">خروج</button>
    </div>
  </nav>

  <div class="page">
    <div class="page-header">
      <div class="page-title">اشتراكاتي</div>
      <div class="page-sub">عرض جميع مشترياتك وتفاصيل التسليم</div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon" style="background:#eff6ff">🛍️</div>
        <div>
          <div class="stat-val" id="stat-total" style="color:var(--accent)">0</div>
          <div class="stat-label">إجمالي الطلبات</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#d1fae5">✅</div>
        <div>
          <div class="stat-val" id="stat-active" style="color:var(--ok)">0</div>
          <div class="stat-label">اشتراكات نشطة</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef3c7">⏰</div>
        <div>
          <div class="stat-val" id="stat-pending" style="color:var(--warn)">0</div>
          <div class="stat-label">قيد التسليم</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filters">
      <div class="filter-group">
        <button class="filter-btn on" onclick="filterType('all',this)">الكل</button>
        <button class="filter-btn" onclick="filterType('shared',this)">Shared</button>
        <button class="filter-btn" onclick="filterType('private',this)">Private</button>
        <button class="filter-btn" onclick="filterType('bundle',this)">Bundle</button>
      </div>
      <div class="filter-group">
        <button class="filter-btn on" onclick="filterStatus('all',this)">كل الحالات</button>
        <button class="filter-btn" onclick="filterStatus('active',this)">نشط</button>
        <button class="filter-btn" onclick="filterStatus('expired',this)">منتهي</button>
      </div>
      <div class="search-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-inp" id="search-inp" placeholder="ابحث باسم المنتج…" oninput="onSearch()"/>
      </div>
    </div>

    <!-- Orders grid -->
    <div class="orders-grid" id="orders-grid">
      <div class="spin-wrap"><div class="spin"></div></div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Delivery modal -->
<div id="del-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-tool-name">تفاصيل التسليم</div>
      <button onclick="closeModal()" style="width:28px;height:28px;border-radius:8px;border:none;background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body">
      <div style="text-align:center;padding:20px;color:var(--muted)">جاري التحميل…</div>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase
const sb = createClient(
  'https://ixpgqhwausnfjphitsty.supabase.co',
  'sb_publishable_Iz-TCMtlndecE5p-ypewuu_6pwitPTw'
)

let orders = [], currentUser = null
let typeF = 'all', statusF = 'all', searchQ = ''
let currentPage = 1
const PER_PAGE = 9
let authMode = 'signin'

// ── Auth ──
async function checkAuth() {
  const { data: { session } } = await sb.auth.getSession()
  if (session?.user) {
    currentUser = session.user
    showApp()
    loadOrders()
  }
}

async function signIn() {
  const email = document.getElementById('auth-email').value.trim()
  const pass  = document.getElementById('auth-pass').value
  const btn   = document.getElementById('auth-btn')
  const err   = document.getElementById('auth-err')
  err.textContent = ''
  if (!email || !pass) { err.textContent = 'يرجى إدخال البريد وكلمة المرور'; return }
  btn.disabled = true; btn.textContent = authMode === 'signin' ? 'جاري الدخول…' : 'جاري الإنشاء…'

  const { data, error } = authMode === 'signin'
    ? await sb.auth.signInWithPassword({ email, password: pass })
    : await sb.auth.signUp({ email, password: pass })

  btn.disabled = false; btn.textContent = authMode === 'signin' ? 'دخول' : 'إنشاء حساب'

  if (error) { err.textContent = error.message; return }
  if (authMode === 'signup' && !data.session) {
    err.style.color = 'var(--ok)'
    err.textContent = 'تم إرسال رابط التفعيل إلى بريدك'
    return
  }
  currentUser = data.user
  showApp()
  loadOrders()
}

function toggleAuthMode() {
  authMode = authMode === 'signin' ? 'signup' : 'signin'
  const btn = document.getElementById('auth-btn')
  const txt = document.getElementById('auth-toggle-text')
  document.getElementById('auth-err').textContent = ''
  if (authMode === 'signup') {
    btn.textContent = 'إنشاء حساب'
    txt.innerHTML = 'لديك حساب؟ <span>تسجيل الدخول</span>'
  } else {
    btn.textContent = 'دخول'
    txt.innerHTML = 'ليس لديك حساب؟ <span>إنشاء حساب</span>'
  }
}

async function signOut() {
  await sb.auth.signOut()
  currentUser = null
  document.getElementById('app').style.display = 'none'
  document.getElementById('auth-screen').style.display = 'flex'
}

function showApp() {
  document.getElementById('auth-screen').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  const email = currentUser?.email || ''
  document.getElementById('user-email-short').textContent = email.split('@')[0]
  document.getElementById('user-initials').textContent = (email[0] || 'U').toUpperCase()
}

// ── Load orders ──
async function loadOrders() {
  const { data, error } = await sb
    .from('tool_purchases')
    .select('*, shop_tools(name, image_url, category_slug)')
    .eq('member_id', currentUser.id)
    .order('created_at', { ascending: false })

  if (error) { console.error(error); return }
  orders = (data || []).map(o => ({
    ...o,
    tool_name:    o.shop_tools?.name       || o.tool_name || '—',
    tool_image:   o.shop_tools?.image_url  || o.tool_image || null,
    category_slug: o.shop_tools?.category_slug || o.category_slug || 'shared',
  }))
  updateStats()
  renderOrders()
}

function updateStats() {
  const now = new Date()
  const active  = orders.filter(o => !o.expires_at || new Date(o.expires_at) > now).length
  const pending = orders.filter(o => o.category_slug === 'private' && !o.delivered).length
  document.getElementById('stat-total').textContent   = orders.length
  document.getElementById('stat-active').textContent  = active
  document.getElementById('stat-pending').textContent = pending
}

// ── Filters ──
function filterType(t, btn) {
  typeF = t; currentPage = 1
  document.querySelectorAll('.filter-group:first-child .filter-btn').forEach(b => b.classList.remove('on'))
  btn.classList.add('on')
  renderOrders()
}
function filterStatus(s, btn) {
  statusF = s; currentPage = 1
  document.querySelectorAll('.filter-group:nth-child(2) .filter-btn').forEach(b => b.classList.remove('on'))
  btn.classList.add('on')
  renderOrders()
}
function onSearch() {
  searchQ = document.getElementById('search-inp').value.toLowerCase()
  currentPage = 1
  renderOrders()
}

// ── Render ──
function renderOrders() {
  const now = new Date()
  let list = orders.filter(o => {
    if (typeF !== 'all' && o.category_slug !== typeF) return false
    if (statusF === 'active'  && o.expires_at && new Date(o.expires_at) <= now) return false
    if (statusF === 'expired' && (!o.expires_at || new Date(o.expires_at) > now)) return false
    if (searchQ && !(o.tool_name||'').toLowerCase().includes(searchQ)) return false
    return true
  })

  const totalPages = Math.max(1, Math.ceil(list.length / PER_PAGE))
  if (currentPage > totalPages) currentPage = 1
  const paged = list.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE)

  const grid = document.getElementById('orders-grid')
  if (list.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📦</div><p>لا توجد طلبات</p></div>`
    document.getElementById('pagination').innerHTML = ''
    return
  }

  const STRIPES = { shared:'#3b82f6', private:'#8b5cf6', bundle:'#f59e0b' }

  grid.innerHTML = paged.map(o => {
    const stripe   = STRIPES[o.category_slug] || '#6b7a99'
    const typeClass = `type-${o.category_slug}`
    const isExpired = o.expires_at && new Date(o.expires_at) <= now
    const isActive  = !isExpired
    const isPending = o.category_slug === 'private' && !o.delivered
    const statusClass = isExpired ? 'status-expired' : isPending ? 'status-pending' : 'status-active'
    const statusLabel = isExpired ? 'منتهي' : isPending ? 'قيد التسليم' : 'نشط'

    const imgHtml = o.tool_image
      ? `<img src="${esc(o.tool_image)}" onerror="this.parentElement.innerHTML='<div class=\\'initials\\'>${(o.tool_name||'').slice(0,2).toUpperCase()}</div>'">`
      : `<div class="initials" style="font-size:11px;font-weight:800;color:var(--muted)">${(o.tool_name||'').slice(0,2).toUpperCase()}</div>`

    const expiresStr = o.expires_at
      ? new Date(o.expires_at).toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' })
      : '—'
    const createdStr = new Date(o.created_at).toLocaleDateString('ar-EG', { day:'numeric', month:'long', year:'numeric' })
    const amount = o.amount_egp ? `${Number(o.amount_egp).toLocaleString()} EGP` : '—'

    let revealBtn = ''
    if (o.category_slug === 'shared') {
      revealBtn = `<button class="btn-reveal ready" onclick="revealDelivery('${o.id}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        عرض بيانات الحساب
      </button>`
    } else if (o.category_slug === 'private') {
      if (!o.delivered) {
        revealBtn = `<button class="btn-reveal pending" disabled>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          قيد التسليم من الأدمن
        </button>`
      } else {
        revealBtn = `<button class="btn-reveal ready" onclick="revealDelivery('${o.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          عرض بيانات الحساب
        </button>`
      }
    } else {
      revealBtn = `<button class="btn-reveal ready" onclick="revealDelivery('${o.id}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        عرض محتويات الباقة
      </button>`
    }

    return `<div class="order-card">
      <div class="card-stripe" style="background:${stripe}"></div>
      <div class="card-head">
        <div class="tool-thumb">${imgHtml}</div>
        <div>
          <div class="card-tool-name">${esc(o.tool_name)}</div>
          <div>
            <span class="card-type ${typeClass}">${o.category_slug}</span>
            <span class="status-pill ${statusClass}" style="margin-right:5px">${statusLabel}</span>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row">
          <span class="info-label">تاريخ الشراء</span>
          <span class="info-val">${createdStr}</span>
        </div>
        <div class="info-row">
          <span class="info-label">ينتهي في</span>
          <span class="info-val ${isExpired ? 'status-expired' : ''}" style="${isExpired ? 'padding:0;background:none;border-radius:0' : ''}">${expiresStr}</span>
        </div>
        <div class="info-row">
          <span class="info-label">المبلغ</span>
          <span class="price-val">${amount}</span>
        </div>
      </div>
      <div class="card-footer">${revealBtn}</div>
    </div>`
  }).join('')

  // Pagination
  renderPagination(totalPages)
}

function renderPagination(total) {
  if (total <= 1) { document.getElementById('pagination').innerHTML = ''; return }
  let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1 ? 'disabled' : ''}>‹</button>`
  for (let i = 1; i <= total; i++) {
    if (i === 1 || i === total || Math.abs(i - currentPage) <= 1) {
      html += `<button class="page-btn ${i===currentPage ? 'on' : ''}" onclick="goPage(${i})">${i}</button>`
    } else if (Math.abs(i - currentPage) === 2) {
      html += `<span style="color:var(--muted);font-size:12px;padding:0 2px">…</span>`
    }
  }
  html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total ? 'disabled' : ''}>›</button>`
  document.getElementById('pagination').innerHTML = html
}

function goPage(p) { currentPage = p; renderOrders(); window.scrollTo({ top: 0, behavior: 'smooth' }) }

// ── Reveal delivery ──
async function revealDelivery(orderId) {
  document.getElementById('del-modal').classList.remove('hidden')
  const order = orders.find(o => o.id === orderId)
  document.getElementById('modal-tool-name').textContent = order?.tool_name || 'تفاصيل التسليم'
  document.getElementById('modal-body').innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">جاري التحميل…</div>'

  const { data, error } = await sb
    .from('account_deliveries')
    .select('*')
    .eq('order_id', orderId)
    .single()

  if (error || !data) {
    document.getElementById('modal-body').innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted)">لم يتم التسليم بعد أو لا توجد بيانات متاحة</div>'
    return
  }

  // Mark as viewed
  if (!order?.viewed_at) {
    sb.from('tool_purchases').update({ viewed_at: new Date().toISOString() }).eq('id', orderId)
  }

  let html = ''
  if (data.delivery_type === 'account') {
    html += `<div class="cred-box">
      <div class="cred-label">البريد الإلكتروني</div>
      <div class="cred-val">
        <span dir="ltr">${esc(data.email || '—')}</span>
        ${data.email ? `<button class="copy-btn" onclick="copyText('${esc(data.email)}')">نسخ</button>` : ''}
      </div>
    </div>
    <div class="cred-box">
      <div class="cred-label">كلمة المرور</div>
      <div class="cred-val">
        <span dir="ltr">${esc(data.password || '—')}</span>
        ${data.password ? `<button class="copy-btn" onclick="copyText('${esc(data.password)}')">نسخ</button>` : ''}
      </div>
    </div>`
  } else if (data.delivery_type === 'key') {
    html += `<div>
      <div class="cred-label">المفتاح / الرمز</div>
      <div class="key-box">
        <div class="key-val">${esc(data.key || '—')}</div>
      </div>
      ${data.key ? `<button class="copy-btn" style="margin-top:8px;padding:7px 16px" onclick="copyText('${esc(data.key)}')">نسخ المفتاح</button>` : ''}
    </div>`
  }

  if (data.notes) {
    html += `<div class="notes-box">
      <strong style="display:block;margin-bottom:4px;font-size:11px">ملاحظات:</strong>
      ${esc(data.notes)}
    </div>`
  }

  if (!html) html = '<div style="text-align:center;padding:20px;color:var(--muted)">لا توجد بيانات تسليم</div>'
  document.getElementById('modal-body').innerHTML = html
}

function closeModal() {
  document.getElementById('del-modal').classList.add('hidden')
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('تم النسخ ✓', 'ok')).catch(() => toast('فشل النسخ', 'err'))
}

// ── Toast ──
function toast(msg, type = 'ok') {
  const el = document.createElement('div')
  el.className = `toast toast-${type}`
  el.textContent = msg
  document.body.appendChild(el)
  setTimeout(() => el.remove(), 3000)
}

function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')
}

// ── Enter key on auth ──
document.getElementById('auth-pass').addEventListener('keydown', e => { if (e.key === 'Enter') signIn() })
document.getElementById('auth-email').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('auth-pass').focus() })

checkAuth()
</script>
